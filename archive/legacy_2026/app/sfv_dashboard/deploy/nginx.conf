# nginx-конфиг для проксирования live-дашборда «Продажи на борту».
# Положить файл в: /etc/nginx/sites-available/sfv-dashboard.conf
# Активировать:    sudo ln -s /etc/nginx/sites-available/sfv-dashboard.conf \
#                            /etc/nginx/sites-enabled/sfv-dashboard.conf
#                  sudo nginx -t && sudo systemctl reload nginx
#
# При публикации во внутреннюю сеть — поменять server_name на реальный
# DNS-алиас интранет-портала (например: bi-bortpro.intra.utair.ru).

upstream sfv_dashboard {
    server 127.0.0.1:8765 fail_timeout=10s;
    keepalive 8;
}

server {
    listen 80;
    server_name bi-bortpro.intra.utair.ru;   # ← поменять на реальный DNS

    access_log  /var/log/nginx/sfv-dashboard.access.log;
    error_log   /var/log/nginx/sfv-dashboard.error.log warn;

    # При желании — закрутить gzip (Plotly.js + статика выигрывает 70%):
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json text/html;

    client_max_body_size 1m;

    # Запас по таймауту: тяжёлый SQL до 30s (см. max_execution_time в clickhouse.py).
    proxy_connect_timeout 5s;
    proxy_send_timeout    35s;
    proxy_read_timeout    35s;

    location / {
        proxy_pass         http://sfv_dashboard;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # Healthcheck-эндпоинт для мониторинга (Zabbix/Prometheus blackbox)
    location = /api/health {
        proxy_pass         http://sfv_dashboard;
        access_log         off;
    }
}
