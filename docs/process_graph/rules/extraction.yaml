# Правила извлечения элементов графа из текста документа СМК.
# Версия 0.1 (черновик), 02.10.2026, D-044. Основа для промта экстрактора и rule-based шагов.
# Признаки (cues) — ориентиры для поиска, а не основание для создания элемента:
# элемент создаётся только при наличии цитаты, подтверждающей его (evidence.quote).

version: "0.1"

global:
  - "Каждый элемент и атрибут — с evidence (document_code, clause, quote, mode, confidence)."
  - "mode только explicit | structural | reference. Догадок нет."
  - "Имя сохраняется как в тексте (name_original). Нормализация — отдельно, без добавления смысла."
  - "Отсутствие значения → null (+ GAP при обязательности). Не дефолт, не среднее."
  - "confidence < 0.5 → элемент не в граф, в _low_confidence.json."
  - "Документ-источник — узел DOCUMENT; REGULATED_BY процесс → источник ставится автоматически."

not_a_process:  # антипаттерны Rule 0 — такие разделы не превращаются в задачи и потоки
  - "раздел «Ответственность», «Права и обязанности», «Должностные обязанности»"
  - "перечни форм, сообщений, систем, документов"
  - "разделы «Термины и определения», «Сокращения», «Нормативные ссылки» (идут в словарь и DOCUMENT)"
  - "нумерация пунктов описательного раздела сама по себе — не порядок шагов"

elements:
  PROCESS:
    cues: ["наименование документа/раздела, описывающего порядок", "«порядок …», «процедура …»", "код процесса в РК"]
    notes: "процесс — по разделу-процедуре; подпроцесс — по вложенному разделу с собственной последовательностью"

  TASK:
    cues: ["действие исполнителя: «оформляет», «направляет», «согласует», «проверяет»", "строка таблицы шагов", "нумерованный шаг процедуры"]
    attributes:
      task_type: "service — только «автоматически», «система формирует»; manual — только «вручную», «на бумаге»; иначе undefined"
      control: "true — «проверяет», «контролирует», «сверяет», «проводит аудит/инспекцию»"
      duration: "«в течение N дней», «не позднее …», «срок — …» — дословно"
    forbidden: ["разбивать одно действие на несколько по смыслу", "объединять разные действия в одно"]

  EVENT:
    start_cues: ["«основанием для начала является»", "«процесс начинается с»", "«при поступлении …»", "«при возникновении необходимости …»"]
    end_cues: ["«результатом является»", "«процесс завершается»", "«… считается выполненным, когда»"]
    trigger: "timer — «ежемесячно», «до N числа»; message — получение от другого процесса/внешнего участника названо явно; иначе none"
    forbidden: ["создавать старт/конец «по умолчанию», если текст их не называет (→ C1/C2 GAP)"]

  GATEWAY:
    cues:
      exclusive: ["«если … то … иначе»", "«в случае …»", "«при наличии / при отсутствии»"]
      parallel: ["«одновременно»", "«параллельно»", "«а также» с явной одновременностью"]
      inclusive: ["«и/или»", "«при необходимости также»"]
    rule: "двусмысленно → gateway_type=undefined + W3; условие ветви — дословно или null"
    forbidden: ["дорисовывать ветвь «иначе», если текст её не описывает", "добавлять возврат «на доработку» без слов «вернуть», «повторно», «на доработку»"]

  LINK:
    cues: ["«в порядке, установленном <документ>»", "«передаётся в <процесс>»", "«далее — согласно …»", "«вход из процедуры …», «переход к процедуре …»"]
    rule: "target_text дословно; target_process_code — только при однозначном совпадении кода"

  ORG_UNIT:
    cues: ["подлежащее при действии", "графа «Исполнитель», «Ответственный»", "названия подразделений и должностей"]
    rule:
      - "kind=department — названо подразделение"
      - "названа только должность → IN_UNIT к подразделению по справочнику (mode=reference); нет/неоднозначно → W7"
      - "собирательный («согласующие подразделения», «члены комиссии») → kind=group, collective=true, без состава; подразделения нет → W1"
      - "MEMBER_OF — только если состав перечислен"

  FLOW:
    cues:
      explicit: ["«после …», «затем», «по завершении», «на основании <результат предыдущего шага>»"]
      structural: ["нумерованная последовательность шагов в разделе-процедуре", "порядок строк таблицы «шаг — исполнитель — срок»", "стрелки схемы в документе"]
    rule: "порядок не задан ни явно, ни структурой → FLOW не строится, W2"

  PERFORMS:
    rule: "исполнитель действия в той же фразе / строке таблицы; не переносить исполнителя с соседнего шага"

  OBJECT:
    cues: ["«оформляет <документ>»", "«по форме приложения N»", "«запись о …»", "«на основании <документ>»"]
    edges: "INPUT — шаг получает/использует; OUTPUT — шаг формирует/изменяет; иначе объект без ребра"
    doc_status_cues: ["проект", "согласованный", "утверждённый", "подписанный", "с замечаниями"]

  DATA_STORE:
    cues: ["«хранится в …»", "«архив»", "«база данных»", "«реестр в системе …»"]

  SOFTWARE:
    cues: ["«в системе X»", "«в AMOS»", "«в СЭД»", "«в 1С»"]
    rule: "SUPPORTED_BY; executes — только если система выполняет шаг сама"

  EXTERNAL:
    cues: ["клиент, поставщик, контрагент, надзорный орган, другая компания группы"]

  BUSINESS_RULE:
    cues: ["норма-условие, не являющаяся действием: «каждому … соответствует …», «по умолчанию считается …», «не допускается …»"]

  RISK:
    cues: ["слово «риск» или «опасность» с привязкой к шагу/процессу"]

  KPI:
    cues: ["число + единица / порог: «не более 2 %», «в течение 3 рабочих дней»", "«рассчитывается как …»", "«показатель …» с мерой"]
    rule: "без меры KPI не создаётся; контрольный шаг остаётся TASK.control=true"

  OWNS:
    cues: ["«владелец процесса»", "«ответственный за процесс»", "РК: владелец процесса"]

  PARTICIPATES:
    cues: ["«согласует», «утверждает», «подписывает», «информируется», «принимает участие»"]

normalization:
  TASK: "глагол в инфинитиве + объект («Согласовать проект договора»)"
  EVENT: "объект + краткое причастие («Заявка получена», «Договор заключён»)"
  SOFTWARE_function: "глагол + существительное"
  rule: "нормализация не добавляет объект/исполнителя, которых нет в тексте; не получается → name_normalized=null"

dictionary:
  TERM: "Термины и сокращения — в отдельный словарь; используются для склейки имён (ВС = воздушное судно), не узлы графа"
